name: Release Actions

permissions:
  # To create a PR
  contents: write
  pull-requests: write
  id-token: write

on:
  workflow_call:
    inputs:
      ref:
        required: true
        description: "GitHub ref to use"
        type: string
      version:
        required: true
        description: "Version to produce"
        type: string
      branch_from_ref:
        required: false
        description: "Commit to branch from, if not the tag"
        type: string
      release-notes:
        required: true
        description: "Release notes to publish"
        type: string

env:
  PULUMI_VERSION: ${{ inputs.version }}
  GITHUB_REF: ${{ inputs.ref }}
  AWS_REGION: us-west-2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-pulumi-dotnet
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: NUGET_PUBLISH_KEY,PULUMI_ACCESS_TOKEN=PULUMI_ACCESS_TOKEN_PRODUCTION

jobs:
  publish-dotnet-sdk:
    name: Publish dotnet SDK
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622 # v2
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: 'recursive'
      - name: Set up DotNet 8.0.x
        id: setup-dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga
      - name: Create global.json
        # This ensures that we use the matrix version instead of the runner's default version
        # https://github.com/actions/setup-dotnet?tab=readme-ov-file#matrix-testing
        run: |
          echo '{"sdk":{"version": "${{ steps.setup-dotnet.outputs.dotnet-version }}"}}' > ./global.json
      - name: Dotnet version
        run: dotnet --version
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: dev
      - name: Build Pulumi SDK
        run: make build_sdk
      - name: Test Pulumi SDK
        run: make test_sdk
      - name: Test Pulumi Automation SDK
        run: make test_sdk_automation
      - name: Publish Packages
        run: dotnet run publish-sdks
